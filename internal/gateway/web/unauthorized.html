<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>需要授权 · 网络唤醒</title><link rel="stylesheet" href="/_wol/assets/style.css"></head><body><main class="card"><span class="label">网络唤醒</span><h1>需要管理授权</h1><p role="status">授权已失效，请返回 App 重试。</p><p class="support">在网络唤醒的“详细”页面选择“路由器管理”，完成系统身份验证后再打开浏览器。普通唤醒权限不能访问路由器管理。</p><p class="support">管理时长由 App 选择，最长 30 分钟，不自动续期，也不会因刷新而延长。修改时长仅对下次授权生效。返回 App 会请求撤销服务器授权，也可在 App 手动结束管理，但无法擦除浏览器已经加载的内容。</p></main></body></html>
